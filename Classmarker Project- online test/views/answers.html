<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Test</title>
    <link rel="shortcut icon" href="http://www.iconarchive.com/download/i103825/custom-icon-design/flatastic-7/Test-paper.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=ZCOOL+KuaiLe" rel="stylesheet"> <!--get universal fonts from google fonts-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous"> <!--get inbuilt bootstrap features using predefined classes from getbootstrap -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous"> <!--icon font from font awesome-->
    <link rel="stylesheet" href="../css/design.css">
    <script src="https://www.gstatic.com/firebasejs/5.8.3/firebase.js"></script>
    <script src="../js/utils/database.js"></script>
    <script src="../js/controllers/answers.js"></script>
    <script src="../js/models/answersOperations.js"></script>
    <script src="../js/utils/timer.js"></script>
</head>
<body style="background-image:url(../../css/bg2.png);  background-repeat: no-repeat; background-size: cover;">
    
                <br>
                <br>
                <br>
    
    <div id="main" class="container rounded border border-success bg-white">
        <h1 class="bg-dark text-white text-center  rounded">Test</h1>
        <br>
        <div class="progress" style="height: 30px;  font-size: 20px;">
                <div class="progress-bar progress-bar-striped bg-info progress-bar-animated" id="prog1" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="width: 0%;">Attempted</div>
                <div class="progress-bar progress-bar-striped bg-danger progress-bar-animated" id="prog2" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="width: 100%;">Unattempted</div>
        </div>
        <br>
        <div class="text-center alert-secondary rounded">
                <p>Time Left: <span id="timer"></span></p>
        </div>
        <br>
        <br>
        <div id="question" >
            <h2 class="alert-primary  rounded" ><b style="margin-left: 10px; margin-right: 10px;">Q<span id="qid"></span>: <span id="qname"></span>-</b></h2>
            <p class="text-center bg-warning rounded" style="width: 70px; float:right;">Marks:<span id="marks"></span></p><br>
            <div id="options" class="form-group bg-light rounded" ><div style="margin-left: 10px; margin-right: 10px;">
                    <br>
                    <input id="A" value="A" name="chooseone" type="radio">&#09;<span id="a"></span>
                    <br>
                    <input id="B" value="B" name="chooseone" type="radio">&#09;<span id="b"></span>
                    <br>
                    <input id="C" value="C" name="chooseone" type="radio">&#09;<span id="c"></span>
                    <br>
                    <input id="D" value="D" name="chooseone" type="radio">&#09;<span id="d"></span>
                    <br>
            </div></div>
        </div>
        <br>
        <br>
        <br>
        <br>
        <div class="shadow p-3 mb-5 bg-white rounded text-center">
            <button id="prev" class="btn btn-primary mr-2"><i class="fas fa-backward"></i>Previous</button>
            <button id="next" class="btn btn-primary mr-2">Next<i class="fas fa-forward"></i></button>
            <button id="skip" class="btn btn-warning mr-2"><i class="fas fa-eraser"></i>Unmark</button>
            <button id="submit" class="btn btn-success mr-2"><i class="fas fa-check-double"></i>Submit</button>
        </div>
    </div>
    <br><br>
</body>
</html>
