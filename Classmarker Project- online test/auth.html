<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Test Application Authentication</title>
    <link rel="shortcut icon" href="https://dmcommunity.files.wordpress.com/2019/04/authenticationaccesscontrol.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=ZCOOL+KuaiLe" rel="stylesheet"> <!--get universal fonts from google fonts-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous"> <!--get inbuilt bootstrap features using predefined classes from getbootstrap -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous"> <!--icon font from font awesome-->
    <link rel="stylesheet" href="css/design.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://www.gstatic.com/firebasejs/5.8.3/firebase.js"></script>
    <script src="js/utils/database.js"></script>
    <script src="js/controllers/auth.js"></script>
</head>
<body>
    <div id="main" class="container bg-light border border-dark ">
        <div class="row">
            <div class="section-1 col-md-8">
                <div id="slider">
                </div>
            </div>
            <div class="section-2 col-md-4">
                <h1 id="head" class="bg-dark text-white text-center">Login</h1>
                <div id="lin" class="container">
                    <div  class="form-group "><label for="lid"><h3>Username:</h3></label><input id="lid" type="text" placeholder="Enter username"  width="20px" class="form-control"></div>
                    <div  class="form-group"><label for="lpswd"><h3>Password:</h3></label><input id="lpswd" type="password" placeholder="Enter password" class="form-control"></div>
                </div>
                <div id="reg" class="container hide">
                    <div  class="form-group"><label for="rid"><h3>Username:</h3></label><input id="rid" type="text" placeholder="Enter username"  width="20px" class="form-control"></div>
                    <div  class="form-group"><label for="rpswd"><h3>Password:</h3></label><input id="rpswd" type="password" placeholder="Enter password" class="form-control"></div>
                    <div  class="form-group"><label for="rcpswd"><h3>Confirm Password:</h3></label><input id="rcpswd" type="password" placeholder="Enter confirm password" class="form-control">
                        <br>
                        <label for="userType"><h3>Type of User:</h3></label>
                        <div  id="userType" class="form-group">
                            <input  id="student" value="student" name="chooseone" type="radio">Student
                            <input  id="teacher" value="teacher" name="chooseone" type="radio" class="offset-md-1">Teacher
                        </div>
                    </div>

                </div>
                <button id="login" class="btn btn-success mr-2 offset-md-1">Log In</button>
                <button id="register" class="btn btn-info mr-2">Register</button>
                <br><br>
            </div>
        </div>
    </div>
</body>
</html>
